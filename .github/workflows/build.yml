name: Build Boards

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sh1106:
    name: Build bread-compact-esp32 (SH1106)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-esp32

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-esp32_sh1106
          path: build/merged-binary.bin
          if-no-files-found: error
